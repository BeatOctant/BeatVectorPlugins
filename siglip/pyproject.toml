[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octantvector-siglip"
version = "0.1.0"
description = "SigLIP so400m cover image view for OctantVector: siglip_cover"
readme = "README.md"
requires-python = ">=3.11.4"  # OctantVector's (tarfile extraction filters)
license = "MIT"
license-files = ["LICENSE"]
# octantvector 0.8, the release OctantHarvest builds with (octantvector.plugin, PLUGIN_API 0.3 with ImageEncoder and norm "none")
dependencies = ["octantvector>=0.12.0,<0.13", "transformers>=4.45", "torch>=2.6", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."octantvector.encoders"]
siglip = "octantvector_siglip"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
