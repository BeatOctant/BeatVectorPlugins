[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "octantvector-whisper"
version = "0.1.0"
description = "Whisper large-v3 view for OctantVector: whisper_language"
readme = "README.md"
requires-python = ">=3.11.4"  # OctantVector's (tarfile extraction filters)
license = "MIT"
license-files = ["LICENSE"]
# octantvector 0.8, the release OctantHarvest builds with (octantvector.plugin, PLUGIN_API 0.3 with norm "none")
dependencies = ["octantvector>=0.10.0,<0.11", "transformers>=4.45", "torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "octantvector[embed]>=0.10.0,<0.11"]  # embed: soxr for resampling the window

[project.entry-points."octantvector.encoders"]
whisper = "octantvector_whisper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
